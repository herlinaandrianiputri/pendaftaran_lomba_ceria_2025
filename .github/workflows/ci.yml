name: CI PHPUnit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: db_pendaftaran_lomba
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: mysqli

      - name: Install Composer dependencies
        run: composer install

      - name: Tunggu MySQL siap
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          for i in `seq 1 30`; do
            if mysql -h 127.0.0.1 -u root -proot -e "SELECT 1" > /dev/null 2>&1; then
              echo "MySQL ready!"
              break
            fi
            echo "MySQL belum siap, retry..."
            sleep 2
          done

      - name: Import Struktur Database
        run: |
          mysql -h 127.0.0.1 -u root -proot db_pendaftaran_lomba < struktur.sql

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --configuration phpunit.xml
